version: 2

updates:
  # Frontend dependencies
  - package-ecosystem: npm
    directory: /apps/word-addin
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Jakarta
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - frontend
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch

  # Backend Python dependencies
  - package-ecosystem: pip
    directory: /apps/api
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Jakarta
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - backend
    groups:
      python-minor-patch:
        update-types:
          - minor
          - patch

  # GitHub Actions dependencies
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Jakarta
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
