name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend Checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          if [ -f apps/word-addin/package.json ]; then
            if [ -f apps/word-addin/package-lock.json ]; then
              npm ci --prefix apps/word-addin
            else
              npm install --prefix apps/word-addin --no-package-lock
            fi
          else
            echo "Frontend project not initialized. Skipping."
          fi

      - name: Lint
        run: |
          if [ -f apps/word-addin/package.json ]; then
            npm --prefix apps/word-addin run lint --if-present
          fi

      - name: Test
        run: |
          if [ -f apps/word-addin/package.json ]; then
            npm --prefix apps/word-addin run test --if-present
          fi

      - name: Build
        run: |
          if [ -f apps/word-addin/package.json ]; then
            npm --prefix apps/word-addin run build --if-present
          fi

  backend:
    name: Backend Checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f apps/api/requirements.txt ]; then
            pip install -r apps/api/requirements.txt
          fi
          pip install ruff pytest

      - name: Syntax check
        run: |
          if [ -d apps/api ]; then
            python -m compileall -q apps/api
          fi

      - name: Lint
        run: |
          if [ -d apps/api ]; then
            ruff check apps/api
          fi

      - name: Test
        run: |
          if [ -d apps/api/tests ]; then
            pytest apps/api/tests -v
          else
            echo "No tests found. Skipping."
          fi
